# GitHub backend — update repo before deploying to production
backend:
  name: github
  repo: andreas122001/tennisclub-doerverden-website
  branch: main
  base_url: https://tc-doerverden-cms-auth.andreaswinje.workers.dev

# Enables (if true) the CMS UI against local files when running `npm run cms`
local_backend: false

# Images uploaded via CMS go to public/uploads/ and are served at /uploads/
media_folder: "public/uploads"
public_folder: "/uploads"

collections:

  # ─── Singleton pages ──────────────────────────────────────────────────────
  - name: "pages"
    label: "Seiten"
    files:

      - name: "home"
        label: "Startseite"
        file: "src/data/home.json"
        fields:
          - { label: "Hero Titel",      name: "heroTitle",    widget: "string" }
          - { label: "Hero Untertitel", name: "heroSubtitle", widget: "string",  required: false }
          - { label: "Hero Bild",       name: "heroImage",    widget: "image",   required: false }
          - { label: "Hero Bild 2 (rechts)",     name: "heroImage2",      widget: "image",  required: false }
          - { label: "Trenner-Position (0–100)", name: "heroSeparation",     widget: "number", default: 55,  value_type: "int",   min: 0, max: 100, required: false }
          - { label: "Trenner-Schrägheit (0–20)", name: "heroSeparationSlant", widget: "number", default: 7, value_type: "float", min: 0, max: 20,  required: false }
          - { label: "CTA-Leiste anzeigen",  name: "ctaEnabled", widget: "boolean", default: true, required: false }
          - { label: "CTA-Titel",            name: "ctaTitle",   widget: "string",  required: false }
          - { label: "CTA-Text",             name: "ctaText",    widget: "text",    required: false }

      - name: "contact"
        label: "Kontakt"
        file: "src/data/contact.json"
        fields:
          - { label: "Straße / Hausnummer", name: "address",      widget: "string" }
          - { label: "PLZ / Ort",           name: "city",         widget: "string" }
          - { label: "Kontaktperson für Tennis",  name: "name_tennis", widget: "string", required: false }
          - { label: "Telefon für Tennis",  name: "phone_tennis", widget: "string", required: false }
          - { label: "Kontaktperson für Boule",  name: "name_boule", widget: "string", required: false }
          - { label: "Telefon für Boule",   name: "phone_boule",  widget: "string", required: false }
          - { label: "E-Mail",              name: "email",        widget: "string", required: false }
          - { label: "Mitgliedschaft (Text auf Kontaktseite)", name: "membershipText", widget: "text", required: false }
          - label: "Öffnungszeiten"
            required: false
            name: "openingHours"
            widget: "list"
            fields:
              - { label: "Tag(e)",  name: "days",  widget: "string", required: false }
              - { label: "Zeiten", name: "hours", widget: "string", required: false }

      - name: "pricing"
        label: "Preise"
        file: "src/content/pages/pricing.md"
        fields:
          - { label: "Überschrift", name: "title", widget: "string" }
          - { label: "Einleitung",  name: "intro", widget: "text",  required: false }
          - label: "Preistabelle"
            name: "table"
            widget: "list"
            fields:
              - { label: "Mitgliedschaft", name: "type",  widget: "string" }
              - { label: "Beitrag",        name: "price", widget: "string" }
              - { label: "Anmerkung",      name: "note",  widget: "string", required: false }
          - { label: "Hinweistext", name: "body", widget: "markdown", required: false }

      - name: "gallery"
        label: "Galerie"
        file: "src/data/gallery.json"
        fields:
          - { label: "Einleitung", name: "intro", widget: "text", required: false }

      - name: "about"
        label: "Über uns"
        file: "src/content/pages/about.md"
        fields:
          - { label: "Titel",   name: "title", widget: "string"   }
          - { label: "Inhalt",  name: "body",  widget: "markdown" }

      - name: "impressum"
        label: "Impressum"
        file: "src/content/pages/impressum.md"
        fields:
          - { label: "Titel",  name: "title", widget: "string"   }
          - { label: "Inhalt", name: "body",  widget: "markdown" }

      - name: "datenschutz"
        label: "Datenschutz"
        file: "src/content/pages/datenschutz.md"
        fields:
          - { label: "Titel",  name: "title", widget: "string"   }
          - { label: "Inhalt", name: "body",  widget: "markdown" }

  # ─── Beiträge (blog posts) ────────────────────────────────────────────────
  - name: "posts"
    label: "Beiträge"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel",       name: "title",       widget: "string"   }
      - { label: "Datum",       name: "date",        widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Beschreibung (Vorschau)", name: "description", widget: "text",   required: false }
      - { label: "Titelbild",   name: "coverImage",  widget: "image",    required: false }
      - { label: "Angepinnt",   name: "pinned",      widget: "boolean",  default: false,    required: false }
      - { label: "Tags",        name: "tags",        widget: "list",     required: false }
      - { label: "Inhalt",      name: "body",        widget: "markdown" }

  # ─── Veranstaltungen ─────────────────────────────────────────────────────
  - name: "events"
    label: "Veranstaltungen"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel",       name: "title",       widget: "string" }
      - { label: "Datum",       name: "date",        widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Beschreibung", name: "description", widget: "text",   required: false }
      - { label: "Ort",          name: "location",    widget: "string", required: false }
      - label: "Verlinkter Beitrag"
        name: "link"
        widget: "relation"
        collection: "posts"
        search_fields: ["title"]
        value_field: "/posts/{{slug}}"
        display_fields: ["title"]
        required: false

  # ─── Galerie ──────────────────────────────────────────────────────────────
  - name: "gallery"
    label: "Galerie"
    folder: "src/content/gallery"
    create: true
    fields:
      - { label: "Bild",         name: "image",   widget: "image"  }
      - { label: "Beschriftung", name: "caption", widget: "string", required: false }
